version: '3.8'

services:
  db:
    image: mongo:6.0
    container_name: visionlearn-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: visionlearn-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://db:27017/visionlearn
      - JWT_SECRET=supersecretjwtkeyforvisionlearnclassrooms12345
      - OPENAI_API_KEY=your_openai_api_key_here
      - GOOGLE_CUSTOM_SEARCH_API_KEY=your_google_custom_search_api_key_here
      - GOOGLE_SEARCH_CX=your_google_cx_here
      - PIXABAY_API_KEY=your_pixabay_api_key_here
      - UNSPLASH_ACCESS_KEY=your_unsplash_access_key_here
      - NODE_ENV=production
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: visionlearn-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
